name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_ZIP: Godot_v4.7.2-stable_mono_linux_x86_64.zip
  GODOT_SHA256: 129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.400
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Install pinned Godot .NET editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$GODOT_ZIP" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/$GODOT_ZIP"
          echo "$GODOT_SHA256  $RUNNER_TEMP/$GODOT_ZIP" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          GODOT4="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "$GODOT4"
          echo "GODOT4=$GODOT4" >> "$GITHUB_ENV"

      - name: Verify project
        run: ./scripts/verify.sh
